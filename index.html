<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anonymous Music</title>

<style>
body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
}

header{
  text-align:center;
  padding:20px;
  background:#1a1a1a;
}

h1{
  color:#ff4fa3;
}

.upload{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  padding:15px;
}

input,select,button{
  padding:12px;
  border:none;
  border-radius:10px;
}

input,select{
  flex:1;
  background:#222;
  color:white;
}

button{
  background:#ff4fa3;
  color:white;
  cursor:pointer;
}

#musicList{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:#1b1b1b;
  border-radius:15px;
  overflow:hidden;
}

iframe{
  width:100%;
  aspect-ratio:16/9;
  border:none;
}

.content{
  padding:15px;
}

.comment{
  background:#2a2a2a;
  padding:8px;
  border-radius:8px;
  margin-top:5px;
}
</style>
</head>

<body>

<header>
  <h1>🎧 Anonymous Music</h1>
</header>

<div class="upload">

  <input
    id="titleInput"
    placeholder="노래 제목">

  <input
    id="linkInput"
    placeholder="유튜브 링크">

  <select id="genreInput">
    <option>발라드</option>
    <option>힙합</option>
    <option>락</option>
    <option>POP</option>
    <option>KPOP</option>
    <option>인디</option>
    <option>JPOP</option>
    <option>OST</option>
    <option>기타</option>
  </select>

  <button onclick="addSong()">
    업로드
  </button>

</div>

<div id="musicList"></div>

<script>

let songs =
JSON.parse(
localStorage.getItem("songs")
) || [];

function saveSongs(){

  localStorage.setItem(
    "songs",
    JSON.stringify(songs)
  );

}

function getYoutubeID(url){

  try{

    const u = new URL(url);

    if(u.hostname.includes("youtu.be")){
      return u.pathname.slice(1);
    }

    return u.searchParams.get("v");

  }catch{

    return "";

  }

}

function addSong(){

  const title =
  document.getElementById("titleInput")
  .value.trim();

  const link =
  document.getElementById("linkInput")
  .value.trim();

  const genre =
  document.getElementById("genreInput")
  .value;

  if(!title || !link){

    alert("제목과 링크를 입력하세요");
    return;

  }

  const id =
  getYoutubeID(link);

  if(!id){

    alert("유튜브 링크가 아닙니다");
    return;

  }

  songs.unshift({

    title,
    genre,
    id,
    likes:0,
    comments:[]

  });

  saveSongs();

  renderSongs();

  document.getElementById("titleInput").value="";
  document.getElementById("linkInput").value="";

}

function likeSong(index){

  songs[index].likes++;

  saveSongs();

  renderSongs();

}

function addComment(index){

  const text =
  prompt("댓글 입력");

  if(!text) return;

  songs[index]
  .comments
  .push(text);

  saveSongs();

  renderSongs();

}

function deleteSong(index){

  if(!confirm("삭제할까요?"))
  return;

  songs.splice(index,1);

  saveSongs();

  renderSongs();

}

function renderSongs(){

  const musicList =
  document.getElementById("musicList");

  musicList.innerHTML="";

  songs.forEach((song,index)=>{

    const card =
    document.createElement("div");

    card.className="card";

    card.innerHTML=`

      <iframe
      src="https://www.youtube.com/embed/${song.id}"
      allowfullscreen>
      </iframe>

      <div class="content">

        <h3>${song.title}</h3>

        <p>🎵 ${song.genre}</p>

        <p>
        ❤️ ${song.likes}
        </p>

        <button
        onclick="likeSong(${index})">
        좋아요
        </button>

        <button
        onclick="addComment(${index})">
        댓글
        </button>

        <button
        onclick="deleteSong(${index})">
        삭제
        </button>

        <div>

          ${song.comments.map(c=>`

            <div class="comment">
              ${c}
            </div>

          `).join("")}

        </div>

      </div>

    `;

    musicList.appendChild(card);

  });

}

renderSongs();

</script>

</body>
</html>
